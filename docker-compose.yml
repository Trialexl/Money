x-logging: &default-logging
  driver: json-file
  options:
    max-size: ${DOCKER_LOG_MAX_SIZE:-10m}
    max-file: "${DOCKER_LOG_MAX_FILE:-5}"

services:
  db:
    image: postgres:14
    restart: unless-stopped
    logging: *default-logging
    mem_limit: ${DB_MEMORY_LIMIT:-768m}
    mem_reservation: ${DB_MEMORY_RESERVATION:-256m}
    pids_limit: ${DB_PIDS_LIMIT:-256}
    environment:
      POSTGRES_DB: ${DB_NAME:-money}
      POSTGRES_USER: ${DB_USER:-money}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-money} -d ${DB_NAME:-money}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: trialexl/money-backend:latest
    restart: unless-stopped
    logging: *default-logging
    mem_limit: ${BACKEND_MEMORY_LIMIT:-768m}
    mem_reservation: ${BACKEND_MEMORY_RESERVATION:-256m}
    pids_limit: ${BACKEND_PIDS_LIMIT:-256}
    env_file:
      - ./.env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
      GUNICORN_THREADS: ${GUNICORN_THREADS:-2}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-180}
      GUNICORN_GRACEFUL_TIMEOUT: ${GUNICORN_GRACEFUL_TIMEOUT:-30}
      GUNICORN_MAX_REQUESTS: ${GUNICORN_MAX_REQUESTS:-500}
      GUNICORN_MAX_REQUESTS_JITTER: ${GUNICORN_MAX_REQUESTS_JITTER:-50}
      BACKUP_DIR: /app/backups/postgres
      BACKUP_LOG_DIR: /app/backups/logs
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; req=urllib.request.Request('http://127.0.0.1:8000/api/v1/health/', headers={'Host': '${APP_DOMAIN:-localhost}'}); urllib.request.urlopen(req, timeout=3).read()\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    expose:
      - "8000"
    volumes:
      - django_static:/app/staticfiles
      - ./backups/postgres:/app/backups/postgres
      - ./backups/logs:/app/backups/logs

  frontend:
    image: trialexl/money-frontend:latest
    restart: unless-stopped
    logging: *default-logging
    mem_limit: ${FRONTEND_MEMORY_LIMIT:-512m}
    mem_reservation: ${FRONTEND_MEMORY_RESERVATION:-128m}
    pids_limit: ${FRONTEND_PIDS_LIMIT:-128}
    environment:
      NODE_OPTIONS: ${FRONTEND_NODE_OPTIONS:---max-old-space-size=256}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const net=require('net'); const socket=net.connect(3000,'127.0.0.1',()=>{socket.end();process.exit(0)}); socket.setTimeout(3000,()=>{socket.destroy();process.exit(1)}); socket.on('error',()=>process.exit(1));\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    expose:
      - "3000"

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    logging: *default-logging
    mem_limit: ${CADDY_MEMORY_LIMIT:-128m}
    mem_reservation: ${CADDY_MEMORY_RESERVATION:-32m}
    pids_limit: ${CADDY_PIDS_LIMIT:-128}
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    healthcheck:
      test: ["CMD-SHELL", "wget --header=\"Host: ${APP_DOMAIN:-localhost}\" -qO- http://127.0.0.1/api/v1/health/ >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - django_static:/srv/django-static:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  postgres_data:
  django_static:
  caddy_data:
  caddy_config:
