x-logging: &default-logging
  driver: json-file
  options:
    max-size: ${DOCKER_LOG_MAX_SIZE:-10m}
    max-file: "${DOCKER_LOG_MAX_FILE:-5}"

services:
  db:
    image: postgres:14
    restart: unless-stopped
    logging: *default-logging
    mem_limit: ${DB_MEMORY_LIMIT:-192m}
    mem_reservation: ${DB_MEMORY_RESERVATION:-64m}
    pids_limit: ${DB_PIDS_LIMIT:-128}
    environment:
      POSTGRES_DB: ${DB_NAME:-money}
      POSTGRES_USER: ${DB_USER:-money}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-money} -d ${DB_NAME:-money}"]
      interval: 60s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 2s

  backend:
    image: trialexl/money-backend:latest
    restart: unless-stopped
    init: true
    command:
      - uvicorn
      - mcp_gateway.combined:application
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --workers
      - "${ASGI_WORKERS:-1}"
      - --limit-concurrency
      - "${ASGI_LIMIT_CONCURRENCY:-8}"
      - --timeout-keep-alive
      - "${ASGI_KEEP_ALIVE:-5}"
      - --proxy-headers
      - --forwarded-allow-ips=*
    logging: *default-logging
    mem_limit: ${BACKEND_MEMORY_LIMIT:-224m}
    mem_reservation: ${BACKEND_MEMORY_RESERVATION:-96m}
    pids_limit: ${BACKEND_PIDS_LIMIT:-256}
    env_file:
      - ./.env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      BACKUP_DIR: /app/backups/postgres
      BACKUP_LOG_DIR: /app/backups/logs
      RUN_STARTUP_MAINTENANCE: "false"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --timeout=3 --header=\"Host: ${APP_DOMAIN:-localhost}\" http://127.0.0.1:8000/api/v1/health/ >/dev/null || exit 1"]
      interval: 90s
      timeout: 5s
      retries: 3
      start_period: 90s
      start_interval: 5s
    expose:
      - "8000"
    volumes:
      - django_static:/app/staticfiles
      - ./backups/postgres:/app/backups/postgres
      - ./backups/logs:/app/backups/logs

  scheduler:
    image: trialexl/money-backend:latest
    restart: unless-stopped
    init: true
    stop_grace_period: ${SCHEDULER_STOP_GRACE_PERIOD:-16m}
    command:
      - python
      - manage.py
      - run_scheduler_loop
      - --interval
      - "${SCHEDULER_INTERVAL_SECONDS:-60}"
      - --lease-seconds
      - "${SCHEDULER_LEASE_SECONDS:-180}"
    logging: *default-logging
    mem_limit: ${SCHEDULER_MEMORY_LIMIT:-128m}
    mem_reservation: ${SCHEDULER_MEMORY_RESERVATION:-48m}
    pids_limit: ${SCHEDULER_PIDS_LIMIT:-64}
    env_file:
      - ./.env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      BACKUP_DIR: /app/backups/postgres
      BACKUP_LOG_DIR: /app/backups/logs
      RUN_STARTUP_MAINTENANCE: "false"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backups/postgres:/app/backups/postgres
      - ./backups/logs:/app/backups/logs

  migrate:
    image: trialexl/money-backend:latest
    profiles: ["maintenance"]
    restart: "no"
    env_file:
      - ./.env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      RUN_STARTUP_MAINTENANCE: "true"
    depends_on:
      db:
        condition: service_healthy
    command: ["true"]
    mem_limit: ${MAINTENANCE_MEMORY_LIMIT:-224m}
    mem_reservation: ${MAINTENANCE_MEMORY_RESERVATION:-64m}
    pids_limit: ${MAINTENANCE_PIDS_LIMIT:-128}
    volumes:
      - django_static:/app/staticfiles

  frontend:
    image: trialexl/money-frontend:latest
    restart: unless-stopped
    logging: *default-logging
    mem_limit: ${FRONTEND_MEMORY_LIMIT:-160m}
    mem_reservation: ${FRONTEND_MEMORY_RESERVATION:-64m}
    pids_limit: ${FRONTEND_PIDS_LIMIT:-96}
    environment:
      NODE_OPTIONS: ${FRONTEND_NODE_OPTIONS:---max-old-space-size=96}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const net=require('net'); const socket=net.connect(3000,'127.0.0.1',()=>{socket.end();process.exit(0)}); socket.setTimeout(3000,()=>{socket.destroy();process.exit(1)}); socket.on('error',()=>process.exit(1));\""]
      interval: 120s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 5s
    expose:
      - "3000"

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    logging: *default-logging
    mem_limit: ${CADDY_MEMORY_LIMIT:-48m}
    mem_reservation: ${CADDY_MEMORY_RESERVATION:-12m}
    pids_limit: ${CADDY_PIDS_LIMIT:-64}
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - django_static:/srv/django-static:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  postgres_data:
  django_static:
  caddy_data:
  caddy_config:
